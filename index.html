<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Mubeen Yousaf | Frontend &amp; Shopify Developer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

<body>
  <!-- Fixed animated background -->
  <div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>

    <nav id="site-nav" aria-label="Main">

      <a href="#skills">Skills</a>

    <section id="contact"><h2>Contact</h2><div id="contact-body" class="body"></div></section>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
